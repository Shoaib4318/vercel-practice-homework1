<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD App</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 20px;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
      }

      label {
        margin-bottom: 8px;
        font-weight: 600;
      }

      input, textarea {
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
      }

      textarea {
        resize: vertical;
        min-height: 90px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: 700;
      }

      .btn-add {
        background: #2563eb;
        color: white;
      }

      .btn-update {
        background: #16a34a;
        color: white;
      }

      .btn-cancel {
        background: #e5e7eb;
        color: #111827;
      }

      .view-btn {
        background: #0ea5e9;
        color: white;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th, td {
        border: 1px solid #e5e7eb;
        padding: 12px;
        text-align: left;
      }

      th {
        background: #f9fafb;
      }

      .td-actions {
        display: flex;
        gap: 8px;
      }

      .edit-btn {
        background: #f59e0b;
        color: white;
      }

      .delete-btn {
        background: #dc2626;
        color: white;
      }

      .empty {
        text-align: center;
        color: #6b7280;
        padding: 18px;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        width: min(100%, 500px);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .modal-content h2 {
        margin-top: 0;
      }

      .detail-row {
        margin-bottom: 12px;
      }

      .detail-row strong {
        display: inline-block;
        min-width: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Student CRUD App</h1>

        <div id="studentModal" class="modal" aria-modal="true" role="dialog">
          <div class="modal-content">
            <h2>Student Details</h2>
            <div class="detail-row"><strong>Name:</strong> <span id="modalName"></span></div>
            <div class="detail-row"><strong>Roll No:</strong> <span id="modalRollNo"></span></div>
            <div class="detail-row"><strong>Tech Info:</strong> <span id="modalTech"></span></div>
            <div class="actions">
              <button type="button" class="btn-cancel" id="closeModalBtn">Close</button>
            </div>
          </div>
        </div>

        <form id="studentForm">
          <div class="form-grid">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" type="text" placeholder="Enter name" required />
            </div>

            <div class="field">
              <label for="rollNo">Roll No</label>
              <input id="rollNo" type="text" placeholder="Enter roll number" required />
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="tech">Tech Info</label>
              <textarea id="tech" placeholder="Write tech details for this student" required></textarea>
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn-add" id="submitBtn">Add Student</button>
            <button type="button" class="btn-cancel" id="cancelBtn" style="display: none;">Cancel</button>
          </div>
        </form>

        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Roll No</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'student-crud-data';
      const defaultStudents = [
        {
          id: 1,
          name: 'Muhammad Shoaib',
          rollNo: 'BITF23M504',
          tech: 'Web development, HTML, CSS, JavaScript, and problem-solving.'
        }
      ];

      const form = document.getElementById('studentForm');
      const nameInput = document.getElementById('name');
      const rollNoInput = document.getElementById('rollNo');
      const techInput = document.getElementById('tech');
      const tableBody = document.getElementById('studentTableBody');
      const submitBtn = document.getElementById('submitBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const studentModal = document.getElementById('studentModal');
      const modalName = document.getElementById('modalName');
      const modalRollNo = document.getElementById('modalRollNo');
      const modalTech = document.getElementById('modalTech');
      const closeModalBtn = document.getElementById('closeModalBtn');

      let students = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultStudents;
      let editingId = null;

      function saveStudents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
      }

      function renderTable() {
        tableBody.innerHTML = '';

        if (students.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" class="empty">No students available.</td></tr>';
          return;
        }

        students.forEach((student) => {
          const row = document.createElement('tr');

          row.innerHTML = `
            <td>${student.name}</td>
            <td>${student.rollNo}</td>
            <td>
              <div class="td-actions">
                <button class="view-btn" data-id="${student.id}">Read</button>
                <button class="edit-btn" data-id="${student.id}">Edit</button>
                <button class="delete-btn" data-id="${student.id}">Delete</button>
              </div>
            </td>
          `;

          tableBody.appendChild(row);
        });
      }

      function resetForm() {
        form.reset();
        editingId = null;
        submitBtn.textContent = 'Add Student';
        submitBtn.className = 'btn-add';
        cancelBtn.style.display = 'none';
      }

      function fillForm(student) {
        nameInput.value = student.name;
        rollNoInput.value = student.rollNo;
        techInput.value = student.tech;
        editingId = student.id;
        submitBtn.textContent = 'Update Student';
        submitBtn.className = 'btn-update';
        cancelBtn.style.display = 'inline-block';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const studentData = {
          name: nameInput.value.trim(),
          rollNo: rollNoInput.value.trim(),
          tech: techInput.value.trim()
        };

        if (!studentData.name || !studentData.rollNo || !studentData.tech) {
          alert('Please fill in name, roll number, and tech info.');
          return;
        }

        if (editingId !== null) {
          students = students.map((student) =>
            student.id === editingId ? { ...student, ...studentData } : student
          );
        } else {
          students.unshift({
            id: Date.now(),
            ...studentData
          });
        }

        saveStudents();
        renderTable();
        resetForm();
      });

      cancelBtn.addEventListener('click', resetForm);
      closeModalBtn.addEventListener('click', () => {
        studentModal.classList.remove('show');
      });

      function openStudentModal(studentId) {
        const student = students.find((item) => item.id === studentId);
        if (!student) return;

        modalName.textContent = student.name;
        modalRollNo.textContent = student.rollNo;
        modalTech.textContent = student.tech;
        studentModal.classList.add('show');
      }

      tableBody.addEventListener('click', function (e) {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;

        const studentId = Number(target.dataset.id);

        if (target.classList.contains('view-btn')) {
          openStudentModal(studentId);
        }

        if (target.classList.contains('delete-btn')) {
          students = students.filter((student) => student.id !== studentId);
          saveStudents();
          renderTable();
          if (editingId === studentId) resetForm();
        }

        if (target.classList.contains('edit-btn')) {
          const student = students.find((item) => item.id === studentId);
          if (student) fillForm(student);
        }
      });

      renderTable();
    </script>
  </body>
</html>
